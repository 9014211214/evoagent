# OpenRouter preset for the pinned SkillEvolBench checkout.
#
# The exact model slug was verified against OpenRouter's live /api/v1/models
# catalogue again on 2026-08-20. Keep the repository secret under the
# OPENROUTER_API_KEY name; the launcher resolves it only at runtime.
name: openrouter-qwen3-coder-plus
short_id: or-qwen3-coder-plus
provider: openrouter
harbor_agent_name: claude-code
agent_model_name: qwen/qwen3-coder-plus

agent_env:
  ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
  ANTHROPIC_AUTH_TOKEN: "${OPENROUTER_API_KEY}"
  ANTHROPIC_API_KEY: ""
  # Bound the tool loop and response size. The prior unbounded two-task smoke
  # accumulated millions of prompt tokens as the agent repeatedly replayed its
  # growing single-task context.
  # 64 covers the 55/41 tool-use events observed in the successful historical
  # tasks while still stopping a runaway session. Context compaction, rather
  # than a too-small turn cap, is the primary token-control mechanism.
  CLAUDE_CODE_MAX_TURNS: "64"
  CLAUDE_CODE_MAX_OUTPUT_TOKENS: "8192"
  CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS: "8192"
  CLAUDE_CODE_MAX_CONTEXT_TOKENS: "100000"
  CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "50"

host_litellm:
  model: openai/qwen/qwen3-coder-plus
  api_base_env: OPENROUTER_BASE_URL
  api_key_env: OPENROUTER_API_KEY
